services:
  web:
    container_name: ai-distributors-web
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        WEB_PORT: ${WEB_PORT:-4200}
    env_file:
      - ../.env
    environment:
      NODE_ENV: development
      PORT: ${WEB_PORT:-4200}
      NEXT_TELEMETRY_DISABLED: '1'
      WATCHPACK_POLLING: 'true'
      API_BASE_URL: http://api:${API_PORT:-3000}
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-3000}
    ports:
      - '${WEB_PORT:-4200}:${WEB_PORT:-4200}'
    volumes:
      - ..:/workspace
      - /workspace/node_modules
      - /workspace/apps/web/node_modules
    depends_on:
      - api
    restart: unless-stopped

  api:
    container_name: ai-distributors-api
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
      args:
        API_PORT: ${API_PORT:-3000}
    env_file:
      - ../.env
    environment:
      NODE_ENV: development
      PORT: ${API_PORT:-3000}
      CHOKIDAR_USEPOLLING: 'true'
      OBSERVE_ENABLED: ${OBSERVE_ENABLED:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_distributor}?schema=public
    ports:
      - '${API_PORT:-3000}:${API_PORT:-3000}'
    volumes:
      - ..:/workspace
      - /workspace/node_modules
      - /workspace/apps/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    container_name: ai-distributors-postgres
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
